name: build
# Every push builds and tests. Pushing a tag v<version> (matching muisti.__version__) also publishes a
# GitHub Release (the installed apps find it and update themselves) and deploys the web app to Vercel
# (open tabs offer a reload). One tag, both updated.
on: [workflow_dispatch, push]
jobs:
  build:
    strategy:
      matrix:
        include:
          - { os: macos-latest, zip: Muisti-macOS.zip }
          - { os: windows-latest, zip: Muisti-Windows.zip }
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - uses: astral-sh/setup-uv@v6
      - run: uv sync
      - if: startsWith(github.ref, 'refs/tags/v')
        run: uv run python -c "import muisti, sys; sys.exit(0 if 'v' + muisti.__version__ == '${{ github.ref_name }}' else 'Tag passt nicht zu __version__')"
      - run: uv run python tests/test_core.py
      - run: uv run python tests/test_phase2.py
      - run: uv run python tests/test_deck_limits.py
      - run: uv run python tests/test_phase3.py
      - run: uv run python tests/test_phase4.py
      - run: uv run python tests/test_phase5.py
      - run: uv run python tests/test_phase6.py
      - run: uv run python tests/test_connector.py
      - run: uv run python tests/test_google_login.py
      - run: uv run python tests/test_updater.py
      - run: uv run python tests/test_cloud.py
        env: { MUISTI_TEST_EMAIL: "${{ secrets.MUISTI_TEST_EMAIL }}", MUISTI_TEST_PASSWORD: "${{ secrets.MUISTI_TEST_PASSWORD }}" }
      - run: npm ci && npm run check && npm test
        working-directory: ui
      - run: uv run python build.py
      - if: runner.os == 'macOS'
        run: dist/Muisti.app/Contents/MacOS/Muisti --selfcheck "$RUNNER_TEMP/selfcheck.txt" || { cat "$RUNNER_TEMP/selfcheck.txt"; exit 1; }
      - if: runner.os == 'Windows'
        name: Smoke test, also as if unzipped with Windows' own tool (every file marked as downloaded)
        shell: pwsh
        run: |
          $app = (Resolve-Path dist/Muisti/Muisti.exe).Path
          $log = "$env:RUNNER_TEMP\selfcheck.txt"
          function Check($label) {
            Remove-Item $log -ErrorAction SilentlyContinue
            # direct start: the shell would refuse a marked exe here (for users: the "Run anyway" prompt)
            $si = [System.Diagnostics.ProcessStartInfo]::new($app, "--selfcheck `"$log`"")
            $si.UseShellExecute = $false
            $p = [System.Diagnostics.Process]::Start($si)
            $p.WaitForExit()
            Write-Host "$label -> exit $($p.ExitCode)"
            if (Test-Path $log) { Get-Content $log | Write-Host }
            return $p.ExitCode
          }
          $files = Get-ChildItem dist/Muisti -Recurse -File
          if ((Check "plain") -ne 0) { exit 1 }
          $files | ForEach-Object { Set-Content -LiteralPath $_.FullName -Stream Zone.Identifier -Value "[ZoneTransfer]`r`nZoneId=3" }
          if ((Check "marked") -ne 0) { exit 1 }
          # without the config the marked build has to fail, or this test proves nothing
          Rename-Item dist/Muisti/Muisti.exe.config cfg.bak
          $without = Check "marked, without Muisti.exe.config"
          Rename-Item dist/Muisti/cfg.bak Muisti.exe.config
          $files | ForEach-Object { Remove-Item -LiteralPath $_.FullName -Stream Zone.Identifier -ErrorAction SilentlyContinue }
          if ($without -eq 0) { Write-Host "::warning::Mark of the Web did not reproduce on this runner" }
      - if: runner.os == 'macOS'
        run: ditto -c -k --keepParent dist/Muisti.app ${{ matrix.zip }}
      - if: runner.os == 'Windows'
        run: Compress-Archive -Path dist/Muisti -DestinationPath ${{ matrix.zip }}
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.zip }}
          path: ${{ matrix.zip }}
          compression-level: 0

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    permissions: { contents: write }
    steps:
      - uses: actions/download-artifact@v4
        with: { merge-multiple: true }
      - name: latest.json (what the apps check, see updater.py)
        run: |
          base="https://github.com/${{ github.repository }}/releases/download/${{ github.ref_name }}"
          tag="${{ github.ref_name }}"
          echo "{\"version\": \"${tag#v}\", \"assets\": {\"Muisti-macOS.zip\": \"$base/Muisti-macOS.zip\", \"Muisti-Windows.zip\": \"$base/Muisti-Windows.zip\"}}" > latest.json
          python3 -m json.tool latest.json
      - run: gh release create "${{ github.ref_name }}" Muisti-macOS.zip Muisti-Windows.zip latest.json --repo "${{ github.repository }}" --generate-notes
        env: { GH_TOKEN: "${{ github.token }}" }

  web:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: release
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - run: npm ci && npm run build:web
        working-directory: ui
      - run: web-api/bundle.sh  # the worker (Anki's engine for statistics, options, import …) into the same folder
      # the built folder goes up as is (static files plus the worker), so it's exactly this tag
      - run: npx --yes vercel@62.7.0 deploy ui/dist-web --prod --yes --token "$VERCEL_TOKEN"
        env:
          VERCEL_TOKEN: "${{ secrets.VERCEL_TOKEN }}"
          VERCEL_ORG_ID: team_VRLdZhwAEKwsBtKcCcQ98w7n
          VERCEL_PROJECT_ID: prj_vGZdPmpVrsi6bLUrBBS5qDHJauGn
