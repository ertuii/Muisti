[project]
name = "muisti"
version = "0.14.2"
description = "Moderner Anki-Klon mit MCP-Server für Claude"
readme = "README.md"
license = "AGPL-3.0-or-later"
authors = [
    { name = "arthur", email = "ar211sch@htwg-konstanz.de" }
]
requires-python = ">=3.12"
dependencies = [
    "anki>=26.9.3",
    "certifi>=2026.10.19",
    "mcp>=2.3.0",
    "pywebview>=6.2.1",
]

[project.scripts]
muisti = "muisti:main"

[build-system]
requires = ["uv_build>=0.13.3,<0.14.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pyinstaller>=6.22.3",
]
